name: Reintento del CI

# El job «Plugin Check (PCP)» descarga plugin-check desde wordpress.org en cada ejecución. Cuando la
# API de wp.org tiene un hipo (dio «A valid URL was not provided» + «The 'plugin-check' plugin could
# not be found» y el job se puso en rojo con el mismo código que el commit anterior en verde), el
# veredicto del CI deja de significar algo. Este flujo reintenta UNA sola vez los jobs que fallaron:
# un fallo real sigue en rojo después del reintento (y no se vuelve a reintentar).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: write

jobs:
  reintentar:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Reintentar los jobs que fallaron (una vez como máximo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          # El número de intento viene en el propio evento (el endpoint /attempts da 404: comprobado el
          # 15/10/2026 con curl y con gh, también para runs que existen. Ver health-check#14). Si ya es el
          # segundo intento, el fallo se toma como real y no se insiste.
          echo "intento del run: $RUN_ATTEMPT"
          if [ "$RUN_ATTEMPT" -ge 2 ]; then
            echo "Ya se reintentó una vez: el fallo se toma como real y no insisto."
            exit 0
          fi
          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY" \
            && echo "Reintento lanzado para el run $RUN_ID." || echo "No se pudo reintentar (queda en rojo, que es lo honesto)."
